<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nemonics Control Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        matrixDark: '#030712',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030712;
            color: #f3f4f6;
        }
        /* Cyber Glass Card */
        .glass-card {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 50px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .glow-button {
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.25);
        }
        .glow-button:hover {
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.45);
        }
        /* Floating Animation for Logo 'N' */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float-logo {
            animation: floatLogo 4s ease-in-out infinite;
        }
        /* Rotating Laser Beam Line */
        @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .beam-wrapper {
            position: absolute;
            inset: -2px;
            border-radius: 2.3rem;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .rotating-laser {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0) 0deg, rgba(56, 189, 248, 0) 240deg, rgba(56, 189, 248, 0.9) 310deg, rgba(129, 140, 248, 1) 360deg);
            animation: rotateBeam 4s linear infinite;
        }
        /* Background Ambient Glow */
        @keyframes moveBg {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }
        .bg-blob {
            animation: moveBg 10s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Background Ambient Lights -->
    <div class="absolute top-1/4 left-1/4 w-[400px] h-[400px] bg-cyan-500/15 rounded-full blur-[140px] pointer-events-none bg-blob"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-indigo-600/15 rounded-full blur-[140px] pointer-events-none bg-blob" style="animation-delay: 5s;"></div>

    <div class="w-full max-w-md relative z-10">
        
        <!-- Main Wrapper containing Rotating Laser Beam & Login Card -->
        <div class="relative">
            <!-- Rotating Laser Beam Border Container -->
            <div class="beam-wrapper p-[2px]">
                <div class="rotating-laser"></div>
            </div>

            <!-- Login Card -->
            <div class="glass-card p-8 sm:p-10 rounded-3xl space-y-6 relative">
                
                <!-- Brand Header / Logo Icon inside the box -->
                <div class="flex items-center gap-4">
                    <div class="inline-block animate-float-logo">
                        <div class="relative">
                            <div class="absolute -inset-1 rounded-2xl bg-gradient-to-tr from-cyan-400 to-indigo-600 blur-sm opacity-60"></div>
                            <div class="relative inline-flex w-12 h-12 rounded-2xl bg-slate-950 border border-cyan-400/40 items-center justify-center font-extrabold text-xl shadow-xl shadow-cyan-500/20 text-cyan-400 tracking-wider">
                                N
                            </div>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-lg font-extrabold tracking-tight text-white">
                            NEMONICS
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">Control Hub Login</p>
                    </div>
                </div>

                <div id="errorMessage" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3.5 rounded-2xl font-semibold text-center"></div>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-400/80 mb-2">Gmail ID</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">✉️</span>
                            <input type="email" id="email" placeholder="user@gmail.com" required 
                                class="w-full bg-slate-900/60 border border-slate-800 rounded-2xl pl-11 pr-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:bg-slate-900 focus:ring-2 focus:ring-cyan-500/25 transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] foundational text-[11px] font-bold uppercase tracking-wider text-cyan-400/80 mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">🔒</span>
                            <input type="password" id="password" placeholder="••••••••••••" required 
                                class="w-full bg-slate-900/60 border border-slate-800 rounded-2xl pl-11 pr-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:bg-slate-900 focus:ring-2 focus:ring-cyan-500/25 transition-all text-sm font-medium">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 via-sky-500 to-indigo-600 hover:opacity-95 text-slate-950 font-extrabold py-4 rounded-2xl glow-button transition-all duration-300 text-xs uppercase tracking-wider mt-2">
                        Login Now
                    </button>
                </form>

                <!-- Bottom Status Footer inside Card -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-800/80 text-[10px] text-slate-500 font-mono">
                    <span class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span> NODE: ACTIVE
                    </span>
                    <span>ENCRYPTION: AES-256</span>
                </div>

            </div>
        </div>

    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.textContent = 'VERIFYING...';
            submitBtn.disabled = true;

            try {
                // Backend ko ab email aur password bheja jayega
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/user';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Invalid Gmail or password. Please try again.';
                    errorDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Login Now';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error("Login error:", err);
                errorDiv.textContent = 'Network or server error. Please try again.';
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = 'Login Now';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
