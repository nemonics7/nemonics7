<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nemonics Control Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }
        .glow-button {
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
        }
        .glow-button:hover {
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.55);
        }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Background Ambient Glow Effects Removed -->

    <div class="w-full max-w-md relative z-10">
        
        <!-- Brand Header / Logo Icon -->
        <div class="text-center mb-8 space-y-3">
            <div class="inline-flex w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-600 via-sky-500 to-cyan-400 items-center justify-center font-extrabold text-2xl shadow-xl shadow-indigo-500/30 text-white tracking-wider">
                N
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 via-sky-600 to-cyan-600 bg-clip-text text-transparent">
                Nemonics
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 font-medium">
                Sign in to access your tracking & conversion hub
            </p>
        </div>

        <!-- Login Card -->
        <div class="glass-card p-8 sm:p-10 rounded-3xl space-y-6">
            
            <div id="errorMessage" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-600 text-xs p-3.5 rounded-2xl font-semibold text-center"></div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">👤</span>
                        <input type="text" id="username" placeholder="Enter your username" required 
                            class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/25 transition-all text-sm font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">🔒</span>
                        <input type="password" id="password" placeholder="••••••••••••" required 
                            class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/25 transition-all text-sm font-medium">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-indigo-600 via-sky-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-bold py-4 rounded-2xl glow-button transition-all duration-300 text-sm tracking-wide mt-2">
                    Sign In to Dashboard
                </button>
            </form>

        </div>

        <!-- Footer Info -->
        <div class="text-center mt-6">
            <p class="text-xs text-slate-400 font-medium">Secured Enterprise Access • Nemonics System</p>
        </div>

    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.textContent = 'Authenticating...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/user';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials. Please try again.';
                    errorDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Sign In to Dashboard';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error("Login error:", err);
                errorDiv.textContent = 'Network or server error. Please try again.';
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = 'Sign In to Dashboard';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
