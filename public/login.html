<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nemonics Control Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Clean Light Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }
        .glow-button {
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.25);
        }
        .glow-button:hover {
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.4);
        }
        /* Floating Animation for Logo 'N' */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float-logo {
            animation: floatLogo 4s ease-in-out infinite;
        }
        /* Background Ambient Glow */
        @keyframes moveBg {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.05); }
        }
        .bg-blob {
            animation: moveBg 10s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6 relative overflow-x-hidden">

    <!-- Background Ambient Lights -->
    <div class="absolute top-1/4 left-1/4 w-[350px] h-[350px] bg-cyan-200/50 rounded-full blur-[120px] pointer-events-none bg-blob"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[350px] h-[350px] bg-indigo-200/50 rounded-full blur-[120px] pointer-events-none bg-blob" style="animation-delay: 5s;"></div>

    <div class="w-full max-w-4xl relative z-10">
        
        <!-- Split Card Container -->
        <div class="glass-card md:rounded-[2.2rem] shadow-2xl flex flex-col md:flex-row overflow-hidden border border-slate-200">
            
            <!-- Left Side: Branding & Context Panel (White Theme) -->
            <div class="w-full md:w-5/12 bg-gradient-to-br from-slate-50 via-white to-cyan-50/40 p-8 md:p-10 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-200 relative text-slate-900">
                
                <!-- Floating 'N' Logo Header -->
                <div class="flex items-center gap-3 animate-float-logo w-fit">
                    <div class="relative">
                        <div class="absolute -inset-1 rounded-2xl bg-gradient-to-tr from-cyan-400 to-indigo-600 blur-sm opacity-30"></div>
                        <!-- Blue Background & White Letter 'N' -->
                        <div class="relative inline-flex w-11 h-11 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 border border-cyan-400/30 items-center justify-center font-extrabold text-lg text-white shadow-lg shadow-cyan-500/20 tracking-wider">
                            N
                        </div>
                    </div>
                    <div>
                        <h2 class="font-extrabold text-slate-900 tracking-wide text-xs">NEMONICS</h2>
                        <p class="text-[9px] text-slate-500 uppercase tracking-widest font-semibold">Control Hub</p>
                    </div>
                </div>

                <div class="my-auto py-8 space-y-3">
                    <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-600 text-[9px] font-bold uppercase tracking-wider">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                        </span> Secured Gateway
                    </div>
                    <h2 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900">
                        Control & Analytics <br><span class="bg-gradient-to-r from-cyan-600 to-indigo-600 bg-clip-text text-transparent">Ecosystem</span>
                    </h2>
                    <p class="text-xs text-slate-600 font-medium leading-relaxed">
                        Access your operational control center and monitor real-time distribution metrics securely.
                    </p>
                </div>

                <div class="text-[10px] text-slate-500 font-mono flex items-center justify-between border-t border-slate-200 pt-4">
                    <span>ENCRYPTION: AES-256</span>
                    <span class="flex items-center gap-1.5 text-cyan-600 font-semibold">
                        <span class="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span> NODE: ACTIVE
                    </span>
                </div>
            </div>

            <!-- Right Side: Login Form Panel (White Theme) -->
            <div class="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center bg-white">
                <div class="max-w-sm w-full mx-auto space-y-5">
                    
                    <!-- Header Title -->
                    <div class="space-y-1">
                        <h2 class="text-lg font-bold text-slate-900 tracking-tight">Welcome Back</h2>
                        <p class="text-xs text-slate-500">Please sign in to your control center account</p>
                    </div>

                    <div id="errorMessage" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs p-3.5 rounded-2xl font-semibold text-center"></div>

                    <!-- LOGIN FORM -->
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-600 mb-1.5">Username</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">👤</span>
                                <input type="text" id="username" placeholder="Enter your username" required 
                                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-cyan-500 focus:bg-white focus:ring-2 focus:ring-cyan-500/20 transition-all text-xs font-medium">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-cyan-600 mb-1.5">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 text-sm">🔒</span>
                                <input type="password" id="password" placeholder="••••••••••••" required 
                                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-cyan-500 focus:bg-white focus:ring-2 focus:ring-cyan-500/20 transition-all text-xs font-medium">
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 via-sky-500 to-indigo-600 hover:opacity-95 text-white font-extrabold py-3.5 rounded-2xl glow-button transition-all duration-300 text-xs uppercase tracking-wider mt-2">
                            Login Now
                        </button>
                    </form>

                    <div class="pt-3 border-t border-slate-100 text-center font-mono">
                        <p class="text-[10px] text-slate-400">
                            SYSTEM STATUS: ONLINE
                        </p>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.textContent = 'VERIFYING...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/user';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials. Please try again.';
                    errorDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Login Now';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error("Login error:", err);
                errorDiv.textContent = 'Network or server error. Please try again.';
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = 'Login Now';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
