<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Nemonics Access Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-dark-mesh {
            background-color: #020617;
            background-image: radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
        }
        
        /* Continuous Floating Animation for 'N' Logo Card */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .floating-brand {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
            animation: floating 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-dark-mesh text-slate-100 min-h-screen flex items-center justify-center p-0 md:p-6">

    <!-- Main Split Container -->
    <div class="w-full max-w-4xl min-h-screen md:min-h-[580px] bg-slate-900 md:rounded-3xl shadow-2xl flex flex-col md:flex-row overflow-hidden border border-slate-800">
        
        <!-- Left Side: Branding & Context Panel -->
        <div class="w-full md:w-5/12 bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950 p-8 md:p-10 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800 relative">
            
            <!-- Continuously Floating 'N' Logo Card -->
            <div class="floating-brand p-3.5 rounded-2xl flex items-center gap-3 w-fit">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-base text-white shadow-lg shadow-cyan-500/30">
                    N
                </div>
                <div>
                    <h2 class="font-extrabold text-white tracking-wide text-xs">Nemonics</h2>
                    <p class="text-[9px] text-slate-400 uppercase tracking-widest font-semibold">Access Portal</p>
                </div>
            </div>

            <div class="my-auto py-8 space-y-3">
                <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-[9px] font-bold uppercase tracking-wider">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                    </span> Secured Gateway
                </div>
                <h2 class="text-xl md:text-2xl font-extrabold tracking-tight text-white">
                    Control & Analytics <br><span class="bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">Ecosystem</span>
                </h2>
                <p class="text-xs text-slate-400 font-medium leading-relaxed">
                    Access your operational control center and monitor real-time distribution metrics securely.
                </p>
            </div>

            <div class="text-[10px] text-slate-500 font-medium flex items-center justify-between border-t border-slate-800/80 pt-4">
                <span>v2.4 Core</span>
                <!-- LIVE Online Status Indicator -->
                <span class="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold flex items-center gap-2 shadow-sm">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span>System Live</span>
                </span>
            </div>
        </div>

        <!-- Right Side: Login Form Panel -->
        <div class="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center bg-slate-950/40">
            <div class="max-w-sm w-full mx-auto space-y-5">
                
                <!-- Header Title -->
                <div class="space-y-1">
                    <h2 class="text-lg font-bold text-white tracking-tight">Welcome Back</h2>
                    <p class="text-xs text-slate-400">Please sign in to your account</p>
                </div>

                <!-- Error / Success Alert Box -->
                <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-medium flex items-center gap-2">
                    <span id="alertIcon">⚠️</span> <span id="alertMessage">Message here</span>
                </div>

                <!-- LOGIN FORM -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter username" required 
                            class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-all font-medium">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required 
                            class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition-all font-medium">
                    </div>

                    <button type="submit" id="loginBtn" 
                        class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:opacity-95 text-white font-bold py-3 rounded-xl shadow-lg shadow-cyan-500/20 transition-all text-xs tracking-wide flex items-center justify-center gap-2 mt-2">
                        <span>Sign In</span>
                        <span>→</span>
                    </button>
                </form>

                <div class="pt-4 border-t border-slate-800/60 text-center">
                    <p class="text-[10px] text-slate-500 font-medium">
                        Protected by Nemonics Security Protocols
                    </p>
                </div>

            </div>
        </div>

    </div>

 <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.textContent = 'VERIFYING...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/user';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials. Please try again.';
                    errorDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Login Now';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error("Login error:", err);
                errorDiv.textContent = 'Network or server error. Please try again.';
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = 'Login Now';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
